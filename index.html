<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weather Dashboard</title>

  <!-- SEO & App Metadata -->
  <meta name="description" content="Interactive weather dashboard with live forecasts, hourly trends, and major city weather updates." />
  <meta name="keywords" content="weather app, forecast dashboard, JavaScript weather, API project" />
  <meta name="theme-color" content="#0d47a1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="style.css" />
</head>

<body class="default">

<!-- Background animation -->
<div id="particles" aria-hidden="true"></div>

<main class="container">

  <!-- Header -->
  <header>
    <h1>🌦 Weather Dashboard</h1>
    <p class="subtitle">Live Weather • Forecasts • Animations</p>
  </header>

  <!-- Search -->
  <section class="search" aria-label="City search">
    <label for="searchInput" class="visually-hidden">Search city</label>
    <input
      id="searchInput"
      type="text"
      placeholder="Search city (e.g. Perth)"
      autocomplete="off"
      aria-label="City name"
    />
    <button type="button" onclick="searchCity()">Search</button>
  </section>

  <!-- MAIN WEATHER -->
  <section
    id="mainWeather"
    class="hidden"
    aria-live="polite"
    aria-label="Current weather"
  ></section>

  <!-- 24 HOURS FORECAST -->
  <section id="hourlySection" class="hidden">
    <h2>⏰ Next 24 Hours</h2>
    <div id="hourly" class="grid"></div>
  </section>

  <!-- 5 DAY FORECAST -->
  <section id="dailySection" class="hidden">
    <h2>📅 5-Day Forecast</h2>
    <div id="daily" class="grid"></div>
  </section>

  <!-- MAJOR CITIES -->
  <section id="majorCitiesSection">
    <h2>🇺🇸 Major US Cities</h2>
    <div id="majorCities" class="grid"></div>
  </section>

</main>

<!-- Footer -->
<footer class="footer">
  <p>Last updated: <span id="lastUpdated"></span></p>
</footer>

<!-- Main JS -->
<script src="script.js"></script>

<!-- Small UX Enhancements -->
<script>
  // Update footer timestamp
  document.getElementById("lastUpdated").innerText =
    new Date().toLocaleString();

  // Allow Enter key to trigger search
  document.getElementById("searchInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      searchCity();
    }
  });
</script>

</body>
</html>
