<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8" />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="default">

<div id="particles"></div>

<div class="container">
  <h1>🌦 Weather Dashboard</h1>
  <p class="subtitle">Live Weather • Forecasts • Animations</p>

  <div class="search">
    <input id="searchInput" placeholder="Search city (e.g. Perth)" />
    <button onclick="searchCity()">Search</button>
  </div>

  <!-- MAIN WEATHER -->
  <section id="mainWeather" class="hidden"></section>

  <!-- 24 HOURS -->
  <section id="hourlySection" class="hidden">
    <h2>⏰ Next 24 Hours</h2>
    <div id="hourly" class="grid"></div>
  </section>

  <!-- 5 DAY -->
  <section id="dailySection" class="hidden">
    <h2>📅 5-Day Forecast</h2>
    <div id="daily" class="grid"></div>
  </section>

  <!-- MAJOR CITIES -->
  <section id="majorCitiesSection">
    <h2>🇺🇸 Major US Cities</h2>
    <div id="majorCities" class="grid"></div>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
